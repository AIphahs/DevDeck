[package]
name = "devdeck"
version = "0.1.0"
description = "DevDeck - Modular Desktop Automation Platform"
authors = ["AIphahs"]
license = "MIT"
repository = "https://github.com/AIphahs/DevDeck"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "devdeck_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "devdeck"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-notification = "2"
tauri-plugin-os = "2"
tauri-plugin-process = "2"
tauri-plugin-shell = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-store = "2"
tauri-plugin-dialog = "2"

# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# System monitoring
sysinfo = "0.32"

# Audio
cpal = "0.15"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
anyhow = "1"
thiserror = "2"

# Encryption (for SQLCipher / secrets)
aes-gcm = "0.10"
base64 = "0.22"

# Process management
which = "7"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
